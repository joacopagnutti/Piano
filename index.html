<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Piano Timbres</title>
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #121212;
            --bg-surface: #1e1e1e;
            --bg-surface-hover: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #00E5FF;
            --accent-dim: rgba(0, 229, 255, 0.1);
            --star-active: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            overscroll-behavior-y: none;
        }

        /* Header & Search */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .search-container {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            padding-left: 40px;
            border-radius: 12px;
            border: 1px solid #444;
            background-color: var(--bg-surface);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Categories (Horizontal Scroll) */
        .categories-wrapper {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-top: 12px;
            padding-bottom: 4px;
            scrollbar-width: none; /* Firefox */
        }
        
        .categories-wrapper::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .chip {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: var(--bg-surface);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip.active {
            background-color: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }

        .chip.fav-chip {
            color: var(--star-active);
            border-color: rgba(255, 215, 0, 0.3);
        }
        .chip.fav-chip.active {
            background-color: rgba(255, 215, 0, 0.1);
            border-color: var(--star-active);
        }

        /* List container */
        main {
            padding: 12px;
            padding-bottom: 40px;
        }

        .tone-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tone-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-surface);
            padding: 16px;
            border-radius: 12px;
            transition: background-color 0.2s;
        }

        .tone-item:active {
            background-color: var(--bg-surface-hover);
        }

        .tone-id {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            min-width: 65px;
            font-family: monospace;
            letter-spacing: -1px;
        }

        .tone-info {
            flex-grow: 1;
            padding-left: 12px;
        }

        .tone-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .tone-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fav-btn {
            background: none;
            border: none;
            color: #444;
            font-size: 1.5rem;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .fav-btn.active {
            color: var(--star-active);
        }
        
        .fav-btn:active {
            transform: scale(1.2);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

    </style>
</head>

            { id: 'piano', name: 'Pianos & Teclas', ranges: [[0,7], [16,23], [131,137], [160,169], [305,310], [350,359], [463,470]] },
            { id: 'guitar', name: 'Guitarras & Bajos', ranges: [[24,39], [140,149], [170,178], [313,314], [361,389], [471,476]] },
            { id: 'strings', name: 'Cuerdas & Coros', ranges: [[40,55], [151,153], [180,199], [340,340], [390,419], [477,489]] },

            { id: 'perc', name: 'Percusión & Étnico', ranges: [[8,15], [104,128], [130,130], [280,304], [311,312], [460,462], [490,499]] }
        ];

        // 3. Estructurar y Parsear Datos
        let tonesData = [];
        rawTones.forEach(str => {
            const id = str.substring(0, 3);
            const name = str.substring(4).trim();
            const idNum = parseInt(id, 10);
            
            // Asignar categoría principal
            let catName = "Extended Synth";
            for (let i = 2; i < categoryGroups.length; i++) {
                const grp = categoryGroups[i];
                if (grp.ranges.some(r => idNum >= r[0] && idNum <= r[1])) {
                    catName = grp.name;
                    break;
                }
            }

            tonesData.push({ id, name, category: catName, idNum });
        });

        // 4. Estado de la App
        let favorites = JSON.parse(localStorage.getItem('piano_favs')) || [];
        let currentFilter = 'all';
        let currentSearch = '';

        // 5. Referencias DOM
        const toneListEl = document.getElementById('toneList');
        const searchInput = document.getElementById('searchInput');
        const categoriesContainer = document.getElementById('categoriesContainer');

        // 6. Funciones Principales
        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('piano_favs', JSON.stringify(favorites));
            renderList();
        }

        function renderCategories() {
            categoriesContainer.innerHTML = categoryGroups.map(cat => `
                <div class="chip ${cat.id === 'favs' ? 'fav-chip' : ''} ${currentFilter === cat.id ? 'active' : ''}" 
                     onclick="setFilter('${cat.id}')">
                    ${cat.name}
                </div>
            `).join('');
        }

        function setFilter(catId) {
            currentFilter = catId;
            renderCategories();
            renderList();
        }

        function renderList() {
            let filtered = tonesData.filter(tone => {
                // Filtro de Búsqueda
                const searchMatch = tone.id.includes(currentSearch) || 
                                    tone.name.toLowerCase().includes(currentSearch.toLowerCase());
                if (!searchMatch) return false;

                // Filtro de Categoría
                if (currentFilter === 'all') return true;
                if (currentFilter === 'favs') return favorites.includes(tone.id);
                
                const catObj = categoryGroups.find(c => c.id === currentFilter);
                if (catObj && catObj.name === tone.category) return true;
                
                return false;
            });

            // Si estamos en "Todos", ordenar para que los favoritos salgan primero
            if (currentFilter === 'all' && currentSearch === '') {
                filtered.sort((a, b) => {
                    const aFav = favorites.includes(a.id);
                    const bFav = favorites.includes(b.id);
                    if (aFav && !bFav) return -1;
                    if (!aFav && bFav) return 1;
                    return a.idNum - b.idNum;
                });
            }

            if (filtered.length === 0) {
                toneListEl.innerHTML = `<div class="empty-state">No se encontraron timbres.</div>`;
                return;
            }

            toneListEl.innerHTML = filtered.map(tone => `
                <div class="tone-item">
                    <div class="tone-id">${tone.id}</div>
                    <div class="tone-info">
                        <div class="tone-name">${tone.name}</div>
                        <div class="tone-category">${tone.category}</div>
                    </div>
                    <button class="fav-btn ${favorites.includes(tone.id) ? 'active' : ''}" 
                            onclick="toggleFavorite('${tone.id}')">
                        ${favorites.includes(tone.id) ? '★' : '☆'}
                    </button>
                </div>
            `).join('');
        }

        // 7. Event Listeners
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderList();
        });

        // Inicializar
        renderCategories();
        renderList();
    </script>
